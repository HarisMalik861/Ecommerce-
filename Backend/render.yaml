# Deploy Backend repo directly on Render (this file lives in Backend/)
services:
  - type: web
    name: ecommerce-ml-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BACKEND_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
