# Production config for trendinsight.live.
# Activated by tls-init.sh after certbot issues certs.

# HTTP -> HTTPS redirect, also serves ACME renewals.
server {
    listen 80;
    listen [::]:80;
    server_name trendinsight.live www.trendinsight.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Redirect www -> apex.
server {
    listen 443 ssl;
    http2 on;
    server_name www.trendinsight.live;

    ssl_certificate /etc/letsencrypt/live/trendinsight.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trendinsight.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    return 301 https://trendinsight.live$request_uri;
}

# Main HTTPS server -> reverse proxy to ecommerce-app:3000.
server {
    listen 443 ssl;
    http2 on;
    server_name trendinsight.live;

    ssl_certificate /etc/letsencrypt/live/trendinsight.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trendinsight.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Allow large CSV uploads from admin dataset upload route.
    client_max_body_size 200M;

    # ACME renewals (certbot --webroot reaches these).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://ecommerce-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
