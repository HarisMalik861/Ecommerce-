# INITIAL config (HTTP only) for trendinsight.live.
# Used during certificate issuance. Replaced by trendinsight.conf after certs exist.

server {
    listen 80;
    listen [::]:80;
    server_name trendinsight.live www.trendinsight.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "Setting up HTTPS for trendinsight.live...\n";
        add_header Content-Type text/plain;
    }
}
